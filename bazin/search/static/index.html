<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bazin Search</title>
<meta name="description" content="Search bazin fabric and West African formalwear vendors: tailors, couture makers, embroiderers and fabric sellers across West Africa and its diaspora.">

<style>
  /* ---------- palette: light (default) ---------- */
  :root {
    --bg: #ffffff;
    --bg-weave: rgba(51,46,134,0.035);
    --surface: #ffffff;
    --surface-2: #f1f1f8;
    --surface-3: #e7e7f2;
    --border: #dfe0ec;
    --text: #17182b;
    --text-muted: #5c5e78;
    --text-faint: #8688a1;
    --indigo: #332e86;
    --indigo-strong: #211d5e;
    --indigo-tint: #edebfb;
    --gold: #8a6414;
    --gold-bright: #b8892a;
    --gold-tint: #f6ecd6;
    --caution-text: #7a4b00;
    --caution-bg: #fbead0;
    --danger: #9c2b23;
    --danger-bg: #fbe7e4;
    --focus: #4740c9;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-1: 0 1px 2px rgba(23,24,43,0.06);
    --shadow-2: 0 10px 28px -14px rgba(23,24,43,0.22);
    --font-display: 'Fraunces', ui-serif, Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  /* ---------- palette: dark ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101124;
      --bg-weave: rgba(163,157,255,0.05);
      --surface: #171833;
      --surface-2: #1d1f3d;
      --surface-3: #262848;
      --border: #33345c;
      --text: #f1f1f8;
      --text-muted: #b4b6d1;
      --text-faint: #82849f;
      --indigo: #a39dff;
      --indigo-strong: #cac6ff;
      --indigo-tint: #262357;
      --gold: #e3c064;
      --gold-bright: #f0d38b;
      --gold-tint: #3a3115;
      --caution-text: #f0cf8e;
      --caution-bg: #3a2e12;
      --danger: #f2a29a;
      --danger-bg: #3d1c19;
      --focus: #b6b0ff;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.5);
      --shadow-2: 0 16px 34px -14px rgba(0,0,0,0.65);
    }
  }

  /* ---------- reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      repeating-linear-gradient(135deg, var(--bg-weave) 0 1px, transparent 1px 15px),
      repeating-linear-gradient(45deg, var(--bg-weave) 0 1px, transparent 1px 15px);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; }
  p { margin: 0; }
  img { max-width: 100%; display: block; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--indigo); }
  ul { margin: 0; padding: 0; list-style: none; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ---------- layout ---------- */
  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: clamp(16px, 4vw, 32px);
    padding-block: clamp(20px, 4vw, 40px) 48px;
  }
  main { display: block; }

  .site-header { margin-bottom: clamp(20px, 4vw, 32px); }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand-name {
    font-family: var(--font-display);
    font-size: clamp(1.7rem, 4vw, 2.2rem);
    font-weight: 700;
    color: var(--indigo);
    letter-spacing: 0.01em;
  }
  .brand-mark { color: var(--gold-bright); }
  .tagline { margin-top: 6px; color: var(--text-muted); max-width: 55ch; }

  /* ---------- search panel ---------- */
  .search-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
    padding: clamp(14px, 3vw, 22px);
    margin-bottom: 20px;
  }
  .search-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  #q {
    flex: 1 1 260px;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
  }
  #q::placeholder { color: var(--text-faint); }
  .btn-primary, .btn-secondary {
    border-radius: var(--radius-md);
    padding: 12px 20px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    white-space: normal;
  }
  .btn-primary {
    background: var(--indigo);
    color: #ffffff;
    border-color: var(--indigo);
  }
  .btn-primary:hover { background: var(--indigo-strong); border-color: var(--indigo-strong); }
  .btn-primary[aria-busy="true"] { opacity: 0.7; cursor: progress; }
  .btn-secondary {
    background: var(--surface);
    color: var(--indigo);
    border-color: var(--border);
  }
  .btn-secondary:hover { background: var(--surface-2); }

  .examples {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  .examples-label { color: var(--text-faint); font-size: 0.85rem; }
  .example-chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .example-chip:hover { border-color: var(--indigo); color: var(--indigo); }

  .filters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 0.82rem; color: var(--text-muted); }
  .field input, .field select {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text);
  }
  #ships_to { text-transform: uppercase; }

  /* ---------- chips / notes ---------- */
  .meta-row { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .notes-list { display: flex; flex-direction: column; gap: 6px; }
  .note-item {
    background: var(--gold-tint);
    color: var(--caution-text);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 0.88rem;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--indigo-tint);
    color: var(--indigo-strong);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.82rem;
    font-weight: 500;
  }

  /* ---------- cluster legend ---------- */
  .cluster-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .cluster-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .cluster-chip.active { font-weight: 700; box-shadow: var(--shadow-1); }
  .cluster-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

  /* ---------- results ---------- */
  .results-summary { color: var(--text-muted); margin-bottom: 10px; font-size: 0.9rem; min-height: 1.2em; }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    gap: 16px;
  }
  .placeholder {
    grid-column: 1 / -1;
    border: 1px dashed var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    color: var(--text-muted);
    text-align: center;
  }
  .placeholder .status-title { color: var(--text); margin-bottom: 6px; font-family: var(--font-display); font-size: 1.1rem; }

  .card {
    position: relative;
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
    overflow: hidden;
  }
  .card-stripe { width: 5px; flex: none; }
  .card-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .card-name {
    font-size: 1.08rem;
    overflow-wrap: anywhere;
  }
  .card-type { color: var(--text-muted); font-size: 0.86rem; margin-top: 2px; }
  .cluster-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px; font-size: 0.76rem; color: var(--text-muted);
    white-space: normal;
  }

  .card-loc { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-muted); font-size: 0.88rem; }
  .geo-badge {
    background: var(--gold-tint); color: var(--caution-text);
    border-radius: 999px; padding: 2px 9px; font-size: 0.78rem; font-weight: 600;
  }

  .card-score { display: flex; align-items: center; gap: 10px; }
  .meter {
    flex: 1; height: 7px; background: var(--surface-3); border-radius: 999px; overflow: hidden;
  }
  .meter-fill { height: 100%; background: linear-gradient(90deg, var(--indigo), var(--gold-bright)); border-radius: inherit; }
  .meter-value { font-weight: 700; color: var(--indigo); min-width: 2.4em; text-align: right; }

  .tag-row, .color-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    background: var(--surface-2); color: var(--text-muted);
    border-radius: 999px; padding: 3px 10px; font-size: 0.78rem;
  }
  .color-dot {
    width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--border); flex: none;
  }
  .color-dot-multi {
    background: conic-gradient(#a3312a, #b8892a, #2f6b4f, #2b4c8c, #6a4e9c, #a3312a);
  }

  .card-price { color: var(--text); font-size: 0.95rem; }
  .card-price .num { font-weight: 700; color: var(--indigo); font-size: 1.02rem; }

  .thumb-row { display: flex; gap: 8px; }
  .thumb {
    flex: 1; max-width: 33%; aspect-ratio: 1 / 1; border-radius: var(--radius-sm);
    overflow: hidden; background: var(--surface-2); border: 1px solid var(--border);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }

  .card-contacts { display: flex; flex-wrap: wrap; gap: 8px; }
  .contact-btn {
    display: inline-block;
    background: var(--indigo); color: #ffffff;
    border-radius: var(--radius-sm); padding: 7px 12px; font-size: 0.82rem; font-weight: 600;
    text-decoration: none;
  }
  .contact-btn:hover { background: var(--indigo-strong); }
  .contact-btn-ghost {
    background: var(--surface-2); color: var(--indigo); border: 1px solid var(--border);
  }
  .contact-btn-ghost:hover { border-color: var(--indigo); }

  .card-meta { color: var(--text-faint); font-size: 0.78rem; }

  .why summary {
    cursor: pointer; color: var(--indigo); font-weight: 600; font-size: 0.86rem;
    list-style: none;
  }
  .why summary::-webkit-details-marker { display: none; }
  .why summary::before { content: "\25B8  "; }
  .why[open] summary::before { content: "\25BE  "; }
  .why-body { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .reasons li, .caveats li {
    font-size: 0.85rem; padding-left: 14px; position: relative; margin-bottom: 4px;
  }
  .reasons li::before { content: "\2022"; position: absolute; left: 0; color: var(--indigo); }
  .caveats li { color: var(--caution-text); }
  .caveats li::before { content: "\2022"; position: absolute; left: 0; color: var(--caution-text); }

  /* ---------- status ---------- */
  .status-region { margin-bottom: 16px; }
  .status {
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .status-loading { background: var(--surface-2); color: var(--text-muted); }
  .status-error { background: var(--danger-bg); color: var(--danger); flex-direction: column; align-items: flex-start; }
  .status-title { font-weight: 700; }
  .status-body { color: inherit; opacity: 0.92; }

  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--indigo);
    animation: spin 0.8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--indigo); }
  }

  /* ---------- footer ---------- */
  .site-footer {
    margin-top: 40px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
    color: var(--text-muted);
    font-size: 0.86rem;
    display: flex; flex-direction: column; gap: 8px;
  }
  .footer-links { display: flex; gap: 14px; flex-wrap: wrap; }
  .footer-links a { color: var(--indigo); font-weight: 600; text-decoration: none; }
  .footer-links a:hover { text-decoration: underline; }
  .site-footer a { color: var(--indigo); }

  @media (max-width: 480px) {
    .thumb-row { gap: 6px; }
    .card-body { padding: 14px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <a class="brand" href="/" style="text-decoration:none;">
      <span class="brand-name">Bazin<span class="brand-mark">.</span></span>
    </a>
    <p class="tagline">Find tailors, couture makers, embroiderers and fabric sellers for bazin and West African formalwear, near you or shipping to you.</p>
  </header>

  <main>
    <section class="search-panel" aria-label="Search vendors">
      <form id="search-form" novalidate="novalidate">
        <label class="sr-only" for="q">Search query</label>
        <div class="search-row">
          <input id="q" name="q" type="search" autocomplete="off" placeholder="luxury white grand boubou maker for a Senegalese wedding in NYC">
          <button id="submit-btn" type="submit" class="btn-primary">Search</button>
        </div>

        <div class="examples" aria-label="Example searches">
          <span class="examples-label">Try:</span>
          <button type="button" class="example-chip" data-example="luxury white grand boubou maker for a Senegalese wedding in NYC">grand boubou for a Senegalese wedding, NYC</button>
          <button type="button" class="example-chip" data-example="bazin riche femme moins de 200 euros livraison France">bazin riche femme, &lt;200&#8364;, livraison France</button>
          <button type="button" class="example-chip" data-example="embroidered agbada tailor near Lagos">embroidered agbada tailor, Lagos</button>
        </div>

        <div class="filters-grid">
          <label class="field">
            <span>Near</span>
            <input id="near" name="near" type="text" placeholder="Dakar, Harlem, Paris 18e" autocomplete="off">
          </label>
          <label class="field">
            <span>Radius (km)</span>
            <input id="radius" name="radius" type="number" min="0" step="1" inputmode="numeric" placeholder="25">
          </label>
          <label class="field">
            <span>Ships to</span>
            <input id="ships_to" name="ships_to" type="text" maxlength="2" placeholder="US" autocapitalize="characters" title="Two-letter country code">
          </label>
          <label class="field">
            <span>Vendor type</span>
            <select id="type" name="type">
              <option value="">Any type</option>
              <option value="tailor">Tailor</option>
              <option value="couture_designer">Couture designer</option>
              <option value="embroiderer">Embroiderer</option>
              <option value="fabric_retailer">Fabric retailer</option>
              <option value="fabric_wholesaler">Fabric wholesaler</option>
              <option value="brand_partner">Brand partner</option>
              <option value="rtw_seller">Ready-to-wear seller</option>
              <option value="marketplace_seller">Marketplace seller</option>
            </select>
          </label>
          <label class="field">
            <span>Max budget (USD)</span>
            <input id="max_usd" name="max_usd" type="number" min="0" step="1" inputmode="numeric" placeholder="500">
          </label>
        </div>
      </form>
    </section>

    <div id="status-region" class="status-region" aria-live="polite" hidden></div>

    <section id="meta-row" class="meta-row" hidden>
      <div id="notes-list" class="notes-list"></div>
      <div id="filters-chips" class="chip-row"></div>
    </section>

    <section id="cluster-legend" class="cluster-legend" aria-label="Filter by style cluster" hidden></section>

    <p id="results-summary" class="results-summary num" aria-live="polite"></p>
    <section id="results-grid" class="results-grid"></section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links">
      <a href="/privacy">Privacy</a>
      <a href="/takedown">Takedown</a>
    </nav>
    <p>Vendors are listed from public sources with links to the original. <a href="/takedown">Claim or remove a listing</a>.</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var BUSINESS_TYPE_LABELS = {
    tailor: "Tailor",
    couture_designer: "Couture designer",
    embroiderer: "Embroiderer",
    fabric_retailer: "Fabric retailer",
    fabric_wholesaler: "Fabric wholesaler",
    brand_partner: "Brand partner",
    rtw_seller: "Ready-to-wear seller",
    marketplace_seller: "Marketplace seller",
    unknown: "Vendor"
  };

  var CONTACT_LABELS = {
    whatsapp: "WhatsApp",
    phone: "Call",
    email: "Email",
    instagram_dm: "Instagram DM",
    website: "Website",
    wa_catalog: "WhatsApp catalogue",
    snapchat: "Snapchat",
    telegram: "Telegram",
    other: "Contact"
  };

  var PLATFORM_LABELS = {
    instagram: "Instagram", tiktok: "TikTok", facebook: "Facebook", youtube: "YouTube",
    pinterest: "Pinterest", snapchat: "Snapchat", etsy: "Etsy", afrikrea: "Afrikrea",
    amazon: "Amazon", jumia: "Jumia", coinafrique: "CoinAfrique", expat_dakar: "Expat-Dakar",
    jiji: "Jiji", shopify: "Shop", website: "Website", google_maps: "Google Maps",
    yelp: "Yelp", osm: "OpenStreetMap", overture: "Overture", whatsapp: "WhatsApp",
    web: "Web", other: "Link"
  };

  var COLOR_HEX = {
    white: "#f5f4ef", blue: "#2b4c8c", gold: "#b8892a", black: "#232326", red: "#a3312a",
    green: "#2f6b4f", pink: "#d98aa3", purple: "#6a4e9c", yellow: "#e0b93c", brown: "#7a5230",
    grey: "#8b8d98", beige: "#cbb994", orange: "#c96a2e", turquoise: "#2f9c9c"
  };

  var GEO_LABELS = { local: "Local", ships_to: "Ships to you", corridor: "Diaspora corridor" };

  function qs(id) { return document.getElementById(id); }

  function h(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, key)) continue;
      var val = attrs[key];
      if (val === null || val === undefined || val === false) continue;
      if (key === "class") node.className = val;
      else if (key === "text") node.textContent = val;
      else node.setAttribute(key, val);
    }
    children = children || [];
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (c === null || c === undefined) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  }

  function humanizeConcept(id) {
    var last = String(id || "").split(".").pop();
    return last.replace(/_/g, " ");
  }

  function businessTypeLabel(t) {
    if (BUSINESS_TYPE_LABELS[t]) return BUSINESS_TYPE_LABELS[t];
    var s = String(t || "vendor").replace(/_/g, " ");
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function formatUsd(n) {
    if (typeof n !== "number" || !isFinite(n)) return null;
    var opts = (Math.round(n) === n) ? {} : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
    return "$" + n.toLocaleString("en-US", opts);
  }

  function formatDate(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function geoText(r) {
    var label = GEO_LABELS[r.geo_fit];
    if (!label) return null;
    if (typeof r.distance_km === "number" && isFinite(r.distance_km)) {
      var d = r.distance_km < 10 ? r.distance_km.toFixed(1) : String(Math.round(r.distance_km));
      return label + " · " + d + " km";
    }
    return label;
  }

  function normalizeUrl(value) {
    if (!value) return null;
    var v = String(value).trim();
    if (/^https?:\/\//i.test(v)) return v;
    if (/^[\w.-]+\.[a-z]{2,}([/?#].*)?$/i.test(v)) return "https://" + v;
    return null;
  }

  function contactHref(c) {
    if (c.href) return c.href;
    var value = c.value || "";
    if (c.kind === "whatsapp") {
      var digits = String(value).replace(/[^0-9]/g, "");
      return digits ? "https://wa.me/" + digits : null;
    }
    if (c.kind === "phone") {
      var d2 = String(value).replace(/[^0-9+]/g, "");
      return d2 ? "tel:" + d2 : null;
    }
    if (c.kind === "email") {
      return value.indexOf("@") > -1 ? "mailto:" + value : null;
    }
    return normalizeUrl(value);
  }

  var form = qs("search-form");
  var statusRegion = qs("status-region");
  var metaRow = qs("meta-row");
  var notesList = qs("notes-list");
  var filtersChips = qs("filters-chips");
  var clusterLegend = qs("cluster-legend");
  var resultsSummary = qs("results-summary");
  var resultsGrid = qs("results-grid");
  var submitBtn = qs("submit-btn");

  var currentResults = [];
  var currentClusters = [];
  var activeCluster = null;
  var hasSearched = false;

  function buildParams() {
    var p = new URLSearchParams();
    var q = qs("q").value.trim();
    if (q) p.set("q", q);
    var near = qs("near").value.trim();
    if (near) p.set("near", near);
    var radius = qs("radius").value.trim();
    if (radius !== "" && !isNaN(Number(radius))) p.set("radius_km", String(Number(radius)));
    var shipsTo = qs("ships_to").value.trim().toUpperCase();
    if (shipsTo) p.set("ships_to", shipsTo);
    var type = qs("type").value;
    if (type) p.set("type", type);
    var maxUsd = qs("max_usd").value.trim();
    if (maxUsd !== "" && !isNaN(Number(maxUsd))) p.set("max_usd", String(Number(maxUsd)));
    return p;
  }

  function clearStatus() {
    statusRegion.hidden = true;
    statusRegion.replaceChildren();
  }

  function showLoading() {
    statusRegion.hidden = false;
    statusRegion.replaceChildren(
      h("div", { class: "status status-loading" }, [
        h("span", { class: "spinner", "aria-hidden": "true" }, []),
        h("p", { text: "Searching the index…" }, [])
      ])
    );
  }

  function showFetchError(message) {
    var retry = h("button", { type: "button", class: "btn-secondary" }, ["Try again"]);
    retry.addEventListener("click", function () { runSearch(); });
    statusRegion.hidden = false;
    statusRegion.replaceChildren(
      h("div", { class: "status status-error", role: "alert" }, [
        h("p", { class: "status-title", text: "Search is unavailable." }, []),
        h("p", { class: "status-body", text: message }, []),
        retry
      ])
    );
  }

  function renderMeta(data) {
    var notes = Array.isArray(data.notes) ? data.notes : [];
    var applied = Array.isArray(data.applied_filters) ? data.applied_filters : [];
    notesList.replaceChildren();
    filtersChips.replaceChildren();
    notes.forEach(function (n) { notesList.appendChild(h("p", { class: "note-item" }, [String(n)])); });
    applied.forEach(function (f) { filtersChips.appendChild(h("span", { class: "chip" }, [String(f)])); });
    metaRow.hidden = notes.length === 0 && applied.length === 0;
  }

  function renderClusterLegend() {
    clusterLegend.replaceChildren();
    if (!currentClusters.length) { clusterLegend.hidden = true; return; }
    clusterLegend.hidden = false;
    var allBtn = h("button", {
      type: "button",
      class: "cluster-chip" + (activeCluster ? "" : " active"),
      "data-cluster": ""
    }, [
      h("span", { class: "cluster-dot", style: "background:var(--text-faint)" }, []),
      "All styles · " + currentResults.length
    ]);
    clusterLegend.appendChild(allBtn);
    currentClusters.forEach(function (c) {
      var hue = isFinite(c.hue) ? c.hue : 231;
      var isActive = activeCluster === c.id;
      var btn = h("button", {
        type: "button",
        class: "cluster-chip" + (isActive ? " active" : ""),
        "data-cluster": c.id,
        style: isActive ? ("border-color:hsl(" + hue + ", 45%, 45%);color:hsl(" + hue + ", 45%, 32%)") : null
      }, [
        h("span", { class: "cluster-dot", style: "background:hsl(" + hue + ", 45%, 50%)" }, []),
        (c.label || "Cluster") + " · " + (c.count || 0)
      ]);
      clusterLegend.appendChild(btn);
    });
  }

  function buildTagRow(concepts) {
    if (!concepts || !concepts.length) return null;
    var row = h("div", { class: "tag-row" }, []);
    concepts.forEach(function (id) { row.appendChild(h("span", { class: "tag" }, [humanizeConcept(id)])); });
    return row;
  }

  function buildColorRow(colors) {
    if (!colors || !colors.length) return null;
    var row = h("div", { class: "color-row" }, []);
    colors.forEach(function (name) {
      var hex = COLOR_HEX[name];
      row.appendChild(hex
        ? h("span", { class: "color-dot", title: name, "aria-hidden": "true", style: "background:" + hex }, [])
        : h("span", { class: "color-dot color-dot-multi", title: name, "aria-hidden": "true" }, []));
    });
    row.appendChild(h("span", { class: "sr-only", text: "Colours: " + colors.join(", ") }, []));
    return row;
  }

  function buildThumbRow(thumbnails, name) {
    if (!thumbnails || !thumbnails.length) return null;
    var row = h("div", { class: "thumb-row" }, []);
    thumbnails.slice(0, 3).forEach(function (src) {
      var wrap = h("div", { class: "thumb" }, []);
      var img = h("img", {
        src: src,
        alt: name ? name + " sample photo" : "Vendor sample photo",
        loading: "lazy",
        referrerpolicy: "no-referrer"
      }, []);
      img.addEventListener("error", function () { wrap.hidden = true; });
      wrap.appendChild(img);
      row.appendChild(wrap);
    });
    return row;
  }

  function buildContacts(result) {
    var wrap = h("div", { class: "card-contacts" }, []);
    var any = false;
    (result.contact || []).forEach(function (c) {
      var href = contactHref(c);
      if (!href) return;
      any = true;
      var external = /^https?:/i.test(href);
      wrap.appendChild(h("a", {
        class: "contact-btn",
        href: href,
        target: external ? "_blank" : null,
        rel: external ? "noopener" : null
      }, [CONTACT_LABELS[c.kind] || businessTypeLabel(c.kind)]));
    });
    (result.identities || []).forEach(function (idn) {
      if (!idn.url) return;
      any = true;
      var label = PLATFORM_LABELS[idn.platform] || businessTypeLabel(idn.platform);
      wrap.appendChild(h("a", {
        class: "contact-btn contact-btn-ghost",
        href: idn.url,
        target: "_blank",
        rel: "noopener"
      }, [label + (idn.handle ? " · @" + idn.handle : "")]));
    });
    return any ? wrap : null;
  }

  function buildWhy(result) {
    var reasons = result.reasons || [];
    var caveats = result.caveats || [];
    if (!reasons.length && !caveats.length) return null;
    var body = h("div", { class: "why-body" }, []);
    if (reasons.length) {
      var rl = h("ul", { class: "reasons" }, []);
      reasons.forEach(function (r) { rl.appendChild(h("li", {}, [String(r)])); });
      body.appendChild(rl);
    }
    if (caveats.length) {
      var cl = h("ul", { class: "caveats" }, []);
      caveats.forEach(function (c) { cl.appendChild(h("li", {}, [String(c)])); });
      body.appendChild(cl);
    }
    return h("details", { class: "why" }, [h("summary", {}, ["Why this result"]), body]);
  }

  function renderCard(result) {
    var hue = (result.cluster && isFinite(result.cluster.hue)) ? result.cluster.hue : null;
    var stripe = h("div", {
      class: "card-stripe",
      "aria-hidden": "true",
      style: "background:" + (hue !== null ? "hsl(" + hue + ", 45%, 50%)" : "var(--border)")
    }, []);

    var locBits = [result.city, result.country].filter(Boolean);
    var locLine = locBits.length ? locBits.join(", ") : "Location not shared";
    var geo = geoText(result);

    var head = h("div", { class: "card-head" }, [
      h("div", {}, [
        h("h3", { class: "card-name" }, [result.name || "Unnamed vendor"]),
        h("p", { class: "card-type" }, [businessTypeLabel(result.business_type)])
      ]),
      result.cluster ? h("span", { class: "cluster-badge" }, [
        h("span", { class: "cluster-dot", style: "background:hsl(" + (hue !== null ? hue : 231) + ", 45%, 50%)" }, []),
        result.cluster.label || "Cluster"
      ]) : null
    ]);

    var loc = h("div", { class: "card-loc" }, [
      h("span", {}, [locLine]),
      geo ? h("span", { class: "geo-badge num" }, [geo]) : null
    ]);

    var scoreVal = Math.max(0, Math.min(1, Number(result.score) || 0));
    var scorePct = Math.round(scoreVal * 100);
    var score = h("div", { class: "card-score" }, [
      h("div", {
        class: "meter", role: "progressbar",
        "aria-valuemin": "0", "aria-valuemax": "100",
        "aria-valuenow": String(scorePct), "aria-label": "Quality score"
      }, [
        h("div", { class: "meter-fill", style: "width:" + scorePct + "%" }, [])
      ]),
      h("span", { class: "num meter-value" }, [scoreVal.toFixed(2)])
    ]);

    var price = formatUsd(typeof result.price_from_usd === "number" ? result.price_from_usd : null);

    var ec = typeof result.evidence_count === "number" ? result.evidence_count : 0;
    var metaParts = [ec + (ec === 1 ? " evidence item" : " evidence items")];
    var activeDate = formatDate(result.last_active);
    metaParts.push(activeDate ? "Active " + activeDate : "Activity not reported");

    var body = h("div", { class: "card-body" }, [
      head, loc, score,
      buildTagRow(result.concepts),
      buildColorRow(result.colors),
      price ? h("p", { class: "card-price" }, ["from ", h("span", { class: "num" }, [price])]) : null,
      buildThumbRow(result.thumbnails, result.name),
      buildContacts(result),
      h("p", { class: "card-meta num" }, [metaParts.join(" · ")]),
      buildWhy(result)
    ]);

    return h("article", { class: "card" }, [stripe, body]);
  }

  function renderResultsList() {
    var list = activeCluster
      ? currentResults.filter(function (r) { return r.cluster && r.cluster.id === activeCluster; })
      : currentResults;
    resultsGrid.replaceChildren();

    if (!hasSearched) {
      resultsSummary.textContent = "";
      resultsGrid.appendChild(h("div", { class: "placeholder" }, ["Run a search to see matching vendors."]));
      return;
    }

    if (!currentResults.length) {
      resultsSummary.textContent = "";
      resultsGrid.appendChild(h("div", { class: "placeholder" }, [
        h("p", { class: "status-title" }, ["No vendors matched."]),
        h("p", {}, ["Try a wider radius, a nearby diaspora hub, or fewer filters."])
      ]));
      return;
    }

    if (!list.length) {
      resultsSummary.textContent = "0 of " + currentResults.length + " vendors in this style";
      resultsGrid.appendChild(h("div", { class: "placeholder" }, [
        h("p", {}, ["No vendors in this style cluster. Clear the filter to see all results."])
      ]));
      return;
    }

    resultsSummary.textContent = activeCluster
      ? list.length + " of " + currentResults.length + " vendors"
      : list.length + (list.length === 1 ? " vendor" : " vendors");

    list.forEach(function (r) { resultsGrid.appendChild(renderCard(r)); });
  }

  function runSearch(e) {
    if (e && e.preventDefault) e.preventDefault();
    var params = buildParams();
    submitBtn.disabled = true;
    submitBtn.setAttribute("aria-busy", "true");
    showLoading();
    fetch("/search?" + params.toString(), { headers: { "Accept": "application/json" } })
      .then(function (res) {
        if (!res.ok) throw new Error("Server returned " + res.status + ".");
        return res.json();
      })
      .then(function (data) {
        data = data || {};
        hasSearched = true;
        clearStatus();
        currentResults = Array.isArray(data.results) ? data.results : [];
        currentClusters = Array.isArray(data.clusters) ? data.clusters : [];
        activeCluster = null;
        renderMeta(data);
        renderClusterLegend();
        renderResultsList();
      })
      .catch(function (err) {
        hasSearched = true;
        currentResults = [];
        currentClusters = [];
        metaRow.hidden = true;
        clusterLegend.hidden = true;
        resultsSummary.textContent = "";
        resultsGrid.replaceChildren();
        showFetchError(err && err.message ? err.message : "Check your connection and try again.");
      })
      .then(function () {
        submitBtn.disabled = false;
        submitBtn.removeAttribute("aria-busy");
      });
  }

  clusterLegend.addEventListener("click", function (ev) {
    var target = ev.target;
    if (target.nodeType === 3) target = target.parentElement;
    var btn = target ? target.closest(".cluster-chip") : null;
    if (!btn) return;
    var id = btn.getAttribute("data-cluster") || null;
    activeCluster = (!id || activeCluster === id) ? null : id;
    renderClusterLegend();
    renderResultsList();
  });

  form.addEventListener("submit", runSearch);

  var exampleChips = document.querySelectorAll(".example-chip");
  for (var i = 0; i < exampleChips.length; i++) {
    exampleChips[i].addEventListener("click", (function (btn) {
      return function () {
        qs("q").value = btn.getAttribute("data-example") || "";
        runSearch();
      };
    })(exampleChips[i]));
  }

  renderResultsList();
})();
</script>
</body>
</html>
