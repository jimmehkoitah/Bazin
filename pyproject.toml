[project]
name = "bazin"
version = "0.1.0"
description = "Bazin discovery engine: data pipeline, scoring, clustering and search"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "voyageai>=0.3",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "phonenumbers>=8.13",
  "h3>=4.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pillow>=10.3",
  "imagehash>=4.3",
  "python-dateutil>=2.9",
  "unidecode>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
bazin = "bazin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bazin"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
